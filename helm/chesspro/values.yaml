config:
  port: "8080"
  appEnv: production
  stockfishPath: /usr/bin/stockfish

backend:
  image:
    repository: ghcr.io/iamrpm/chesspro-go
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env:
    JWT_ACCESS_SECRET: "" # set via --set
    JWT_REFRESH_SECRET: ""
    GEMINI_API_KEY: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    GOOGLE_REDIRECT_URI: ""
    CLIENT_HOME_URL: ""
    CORS_ORIGIN: ""

frontend:
  image:
    repository: ghcr.io/iamrpm/chesspro-frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik   # k3s default ingress controller
  host: chesspro.local
  tls: false

postgresql:
  auth:
    username: chess
    password: ""   # set via --set postgresql.auth.password=...
    database: chesspro
  primary:
    persistence:
      size: 2Gi

redis:
  auth:
    enabled: false
  architecture: standalone
  master:
    persistence:
      size: 1Gi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

serviceAccount:
  create: false
