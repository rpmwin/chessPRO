apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chesspro.backend.fullname" . }}-migrate
  labels:
    {{- include "chesspro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until psql "$DATABASE_URL" -c '\q' 2>/dev/null; do
                echo "waiting for postgres..."; sleep 3
              done
              psql "$DATABASE_URL" -f /migrations/001_create_users.sql
              psql "$DATABASE_URL" -f /migrations/002_create_analyses.sql
              echo "migrations complete"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "chesspro.backend.fullname" . }}-secret
                  key: DATABASE_URL
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "chesspro.backend.fullname" . }}-migrations
