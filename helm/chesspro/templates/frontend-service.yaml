apiVersion: v1
kind: Service
metadata:
  name: {{ include "chesspro.frontend.fullname" . }}
  labels:
    {{- include "chesspro.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
      name: http
