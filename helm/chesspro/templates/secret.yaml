{{- /* Secrets injected via --set in CI/CD. Do NOT commit actual values. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chesspro.backend.fullname" . }}-secret
  labels:
    {{- include "chesspro.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | quote }}
  JWT_ACCESS_SECRET: {{ .Values.backend.env.JWT_ACCESS_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.backend.env.JWT_REFRESH_SECRET | quote }}
  GEMINI_API_KEY: {{ .Values.backend.env.GEMINI_API_KEY | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.backend.env.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.backend.env.GOOGLE_CLIENT_SECRET | quote }}
