{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chesspro.name" . }}
  labels:
    {{- include "chesspro.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    # Required for SSE streaming (/analysis/stream) — disables response buffering
    traefik.ingress.kubernetes.io/buffering: |
      maxRequestBodyBytes = 0
      memRequestBodyBytes = 0
      maxResponseBodyBytes = 0
      memResponseBodyBytes = 0
      retryExpression = ""
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /analysis
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /chesscom
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.backend.fullname" . }}
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "chesspro.frontend.fullname" . }}
                port:
                  number: 80
{{- end }}
